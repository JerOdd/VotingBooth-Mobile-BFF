spring.application.name=mobile-bff
server.port=8086
spring.jackson.property-naming-strategy=SNAKE_CASE
server.error.include-message=always
# Framework errors (unsupported API version, bad parameter...) come back as ProblemDetail, like ours.
spring.mvc.problemdetails.enabled=true

# Downstream VotingBooth APIs, set per environment.
clients.law.base-url=${LAW_API_URL}
clients.representative.base-url=${REPRESENTATIVE_API_URL}

# The API version is the first path segment: /v1/laws. Endpoints are mapped to "1+" so they keep serving later
# versions until one of them changes; then only that endpoint gets a "2+" mapping and its old one becomes "1".
spring.mvc.apiversion.use.path-segment=0
spring.mvc.apiversion.supported=1
